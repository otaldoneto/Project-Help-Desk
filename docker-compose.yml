services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: service_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d service_orders"]
      interval: 5s
      timeout: 3s
      retries: 10