name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (H2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: service_orders
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d service_orders"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://localhost:5432/service_orders
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests against PostgreSQL
        run: ./mvnw -B test