name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Tests (H2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test
      - name: Coverage summary
        if: success()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          lm = lc = bm = bc = 0
          with open('target/site/jacoco/jacoco.csv') as f:
              for r in csv.DictReader(f):
                  lm += int(r['LINE_MISSED']); lc += int(r['LINE_COVERED'])
                  bm += int(r['BRANCH_MISSED']); bc += int(r['BRANCH_COVERED'])
          print("### Test coverage")
          print(f"- Lines: {100 * lc / (lc + lm):.1f}% ({lc} of {lc + lm})")
          print(f"- Branches: {100 * bc / (bc + bm):.1f}% ({bc} of {bc + bm})")
          EOF

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: service_orders
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d service_orders"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://localhost:5432/service_orders
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests against PostgreSQL
        run: ./mvnw -B test

  docker-smoke-test:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare the environment file
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API and log in
        run: |
          for i in $(seq 1 40); do
            if curl -sf -X POST http://localhost:8080/auth/login \
                 -H 'Content-Type: application/json' \
                 -d '{"email":"admin@example.com","password":"change-me-admin-password"}' > /dev/null; then
              echo "The API is up and the admin can log in"
              exit 0
            fi
            sleep 3
          done
          echo "The API did not become ready"
          exit 1

      - name: Show the logs when something fails
        if: failure()
        run: docker compose logs