spring.application.name=Management

# Do not keep the JPA session open while rendering the response
spring.jpa.open-in-view=false

# Upper bound for the "size" query parameter
spring.data.web.pageable.max-page-size=100

# Flyway only runs in the prod profile (PostgreSQL); the default H2 profile lets Hibernate create the schema
spring.flyway.enabled=false

# JWT and initial admin: development defaults only. Never use these values in production.
app.jwt.secret=dev-only-secret-change-me-dev-only-secret-change-me
app.jwt.expiration-minutes=15
app.jwt.refresh-expiration-days=7
app.admin.email=admin@example.com
app.admin.password=admin12345